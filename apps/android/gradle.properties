# Gradle properties for the Jarvis Android control app.
#
# android.useAndroidX=true is REQUIRED: the app uses AndroidX
# (Jetpack Compose, Material 3) and the build fails at
# :app:checkDebugAarMetadata without it (APK build run #3).
# android.enableJetifier=true converts any legacy support-library
# transitive dependency to AndroidX.
android.useAndroidX=true
android.enableJetifier=true

# Kotlin code style for the IDE.
kotlin.code.style=official
